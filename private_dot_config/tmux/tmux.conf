source-file ~/.tmux.conf

# Use window name (#W) instead of pane title (#T) in status bar
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Agent status dashboard (prefix + S)
bind S display-popup -E -w 85% -h 70% "AGENT_STATUS_WAIT=1 ~/bin/agent-status"

# Agent sidebar toggle (prefix + s)
bind s run-shell 'sidebar=$(tmux list-panes -t Code -F "#{pane_id}:#{pane_current_command}" | grep agent-sidebar | head -1 | cut -d: -f1); if [ -n "$sidebar" ]; then tmux kill-pane -t "$sidebar"; else tmux split-window -hbf -l 35% -t Code "~/bin/agent-sidebar Code"; fi'
