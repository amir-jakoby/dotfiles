set -g allow-passthrough on
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"


# ============================================================
# Terminal & Colors
# ============================================================
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# Undercurl support (for Neovim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g update-environment "DISPLAY SSH_AUTH_SOCK SSH_AGENT_PID WINDOWID XAUTHORITY"
set -g history-limit 50000
set -g mouse on

# ============================================================
# Prefix: Ctrl+Space
# ============================================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ============================================================
# Session behavior
# ============================================================
set -g detach-on-destroy off    # Stay in tmux when closing a session
bind -N "last-session (via sesh)" L run-shell "sesh last"
bind-key A display-popup -E -w 92% -h 84% "$HOME/.tmux-agent-picker.sh"
bind-key C display-popup -E -w 92% -h 84% "$HOME/.tmux-agent-control-mode.sh status '#{session_name}'"
bind-key D display-popup -E -w 96% -h 84% "$HOME/.tmux-agent-dashboard.sh"
set-window-option -g monitor-activity on
set-window-option -g monitor-silence 120
set-option -g visual-activity off
set-option -g visual-silence on
set-hook -g alert-activity 'run-shell "echo \"$(date +%Y-%m-%dT%H:%M:%S%z) activity #{session_name}:#{window_index}.#{pane_index} title=#{q:pane_title} cmd=#{pane_current_command}\" >> ~/.tmux-agent.log"'
set-hook -g alert-silence 'run-shell "echo \"$(date +%Y-%m-%dT%H:%M:%S%z) idle #{session_name}:#{window_index}.#{pane_index} title=#{q:pane_title} cmd=#{pane_current_command}\" >> ~/.tmux-agent.log"'
set-hook -g after-new-window 'run-shell "tmux pipe-pane -o -t #{pane_id} \"$HOME/.tmux-pane-log.sh #{session_name}:#{window_index}.#{pane_index}\""'
set-hook -g after-split-window 'run-shell "tmux pipe-pane -o -t #{pane_id} \"$HOME/.tmux-pane-log.sh #{session_name}:#{window_index}.#{pane_index}\""'

# ============================================================
# Window/Pane numbering starts at 1
# ============================================================
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g allow-rename off
set-window-option -g automatic-rename off

# ============================================================
# Navigation (no prefix)
# ============================================================
# Alt-arrow to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift-arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift+Alt+arrow to move the current window left/right
bind -n M-S-Left  swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Shift+Alt+h/l to switch windows (vim style)
bind -n M-H previous-window
bind -n M-L next-window

# ============================================================
# Vi mode for copy
# ============================================================
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ============================================================
# Splits open in current directory
# ============================================================
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ============================================================
# Sesh — smart session management (prefix+T)
# ============================================================
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^s all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-s:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# ============================================================
# Catppuccin theme (v2 — manual install)
# ============================================================
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
run /Users/amirjakoby/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# ============================================================
# Floax — floating pane
# ============================================================
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-change-path 'true'

# ============================================================
# Thumbs — quick copy hints (prefix+Space)
# ============================================================
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-upcase-command 'echo -n {} | pbcopy'

# ============================================================
# Resurrect + Continuum — session persistence
# ============================================================
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# ============================================================
# Plugins
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'accessd/tmux-agent-indicator'

# ============================================================
# Agent Indicator — subtle mode
# ============================================================
set -g @agent-indicator-running-window-title-bg ''
set -g @agent-indicator-running-window-title-fg ''
set -g @agent-indicator-needs-input-window-title-bg ''
set -g @agent-indicator-needs-input-window-title-fg ''
set -g @agent-indicator-done-window-title-bg ''
set -g @agent-indicator-done-window-title-fg ''

set -g @agent-indicator-border-enabled 'on'
set -g @agent-indicator-running-border 'colour244'
set -g @agent-indicator-needs-input-border 'yellow'
set -g @agent-indicator-done-border 'green'

set -g @agent-indicator-background-enabled 'off'

set -g @agent-indicator-icons 'claude=✨,codex=⚙️,default=🤖'
set -g @agent-indicator-animation-enabled 'off'
set -g @agent-indicator-animation-speed '300'
set -g @agent-indicator-reset-on-focus 'on'
set -g @agent-indicator-session-dots-active '●'
set -g @agent-indicator-session-dots-inactive '○'
set -g @agent-indicator-session-dots-attention '●'
set -g @agent-indicator-session-dots-attention-color 'yellow'

# ============================================================
# Pane borders + popups
# ============================================================
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-format '#{?@agent_display, #{@agent_display} , #[fg=colour244]#S:#I.#P #[default]#{pane_current_command} }'
set -g popup-border-lines rounded
set -g popup-border-style 'fg=colour39'
set -g popup-style 'bg=default'

# ============================================================
# Status bar
# ============================================================
# Override tmux-yank defaults so copy-mode uses the terminal clipboard path.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right '#{agent_session_dots} #{agent_indicator} #(/Users/amirjakoby/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{E:@catppuccin_status_session} #{continuum_status}'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

# Keep the plugin focus reset, then reconcile stale Codex state without using status-right.
set-hook -g after-select-pane 'run-shell "$HOME/.tmux-agent-focus-sync.sh #{pane_id} #{window_id}"'
set-hook -g after-select-window 'run-shell "$HOME/.tmux-agent-focus-sync.sh #{pane_id} #{window_id}"'
